<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ludvík</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: jedna celoplošná WebGL scéna; text nad ňou pláva ako krieda na tmavej tabuli. Jediný vizuálny svet: tma. */
:root{
  --void:#000000;          /* prázdnota */
  --chalk:#ece6d9;         /* krieda, hlavný text */
  --ink:#8e8a98;           /* tlmené popisky */
  --rift:#a9dcff;          /* stopy: studené svetlo červej diery */
  --ember:#f2b56f;         /* spomienky: teplé svetlo lampy */
  --keeper:#f1d7a4;        /* rukopis Školníka, otázky */
  --veil:rgba(5,6,10,.9);  /* podklad kariet */
  --line:rgba(236,230,217,.16);
  --f-title:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--chalk);overflow:hidden}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.ov{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) calc(var(--open,1)*62%),rgba(0,0,0,.92) calc(var(--open,1)*62% + 38%));opacity:.55}
#fade{background:#000;opacity:0}
#scope{background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 27vmin,#000 28vmin)}
#scope::after{content:"";position:absolute;left:50%;top:50%;width:54vmin;height:54vmin;transform:translate(-50%,-50%);border-radius:50%;box-shadow:inset 0 0 6vmin rgba(0,0,0,.9)}
button{font-family:inherit}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-mono)}
#counts{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:18px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 0 8px #000}
#counts span{display:flex;align-items:center;gap:7px}
#counts span::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
#cClue{color:var(--rift)} #cMem{color:var(--ember)} #cQ{color:var(--keeper)}
#objectives{text-shadow:0 0 10px #000,0 0 3px #000;position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(26rem,calc(100vw - 32px));
  display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
#objectives .oh{grid-column:1/-1;color:var(--keeper);letter-spacing:.22em;margin-bottom:4px}
#objectives .oa{font:italic 400 14px/1.3 var(--f-body);letter-spacing:0;text-transform:none;color:var(--chalk)}
#cross{position:fixed;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);pointer-events:none}
#cross i{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--chalk);opacity:.55;transition:transform .2s,opacity .2s}
#cross.on i{transform:scale(1.8);opacity:.95}
#cross svg{position:absolute;inset:0;transform:rotate(-90deg)}
#cross circle{fill:none;stroke-width:2}
#ringBg{stroke:rgba(236,230,217,.12)} #ring{stroke:var(--keeper);stroke-dasharray:94.25;stroke-dashoffset:94.25}
#prompt{position:fixed;left:50%;top:calc(50% + 34px);transform:translateX(-50%);pointer-events:none;white-space:nowrap;
  font:500 12px/1 var(--f-mono);letter-spacing:.12em;color:var(--chalk);text-shadow:0 0 10px #000,0 0 3px #000}
#prompt kbd{font:inherit;display:inline-block;padding:3px 6px;margin-right:8px;border:1px solid rgba(236,230,217,.45);border-radius:3px}
#prompt.truth{color:var(--rift)} #prompt.memory{color:var(--ember)} #prompt.choice,#prompt.secret,#prompt.catch{color:var(--keeper)}
/* kompas k padajúcemu dievčaťu */
#compass{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
#compass i{position:absolute;left:-7px;top:-7px;width:0;height:0;border-left:14px solid #c9b8ff;border-top:7px solid transparent;border-bottom:7px solid transparent;
  filter:drop-shadow(0 0 6px rgba(201,184,255,.9));transform-origin:7px 7px}
#compass span{position:absolute;left:-40px;top:14px;width:80px;text-align:center;font:500 11px/1 var(--f-mono);letter-spacing:.12em;color:#ddd2ff;text-shadow:0 0 8px #000}
#compass.edge span{top:-26px}

/* titulky */
#subs{position:fixed;left:0;right:0;bottom:calc(8vh + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;text-align:center}
#subWho{font:500 10px/1 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
#subText{max-width:42rem;font:italic 400 clamp(1.02rem,2.1vw,1.28rem)/1.5 var(--f-body);color:var(--chalk);text-wrap:balance;
  text-shadow:0 1px 14px #000,0 0 3px #000,0 0 1px #000}
#subs.keeper #subWho{color:var(--keeper)}
#subs.keeper #subText{font:600 clamp(1.45rem,3.1vw,1.95rem)/1.22 var(--f-hand);color:var(--keeper)}
#subs.other #subWho{color:var(--ember)}
#subs .more{display:inline-block;margin-left:.5em;opacity:.5;font-style:normal;font-size:.8em;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.1}}

/* karta stopy / spomienky */
#card{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.42);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#card .in{--k:var(--rift);width:100%;max-width:34rem;max-height:100%;overflow:auto;box-sizing:border-box;background:var(--veil);border:1px solid var(--line);border-top:2px solid var(--k);
  padding:26px clamp(18px,4vw,32px) 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:rise .5s ease-out}
#card.memory .in{--k:var(--ember)} #card.secret .in{--k:var(--keeper)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#cardKind{font:500 11px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--k)}
#cardTitle{margin:0;font:300 clamp(2rem,6vw,2.6rem)/1.02 var(--f-title);color:var(--chalk);text-wrap:balance}
#cardBody{margin:0;font:italic 400 1.04rem/1.62 var(--f-body);color:var(--chalk)}
#cardNote{margin:0;padding-top:12px;border-top:1px solid var(--line);font:400 .8rem/1.55 var(--f-mono);color:var(--ink)}
#cardNote:empty{display:none}
#cardFoot{font:400 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-align:right}

/* filmový text */
#big{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;text-align:center;opacity:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bigTime{font:400 clamp(.78rem,1.6vw,1rem)/1 var(--f-mono);letter-spacing:.32em;color:var(--rift);text-shadow:0 0 18px rgba(0,0,0,.9)}
#bigTime:empty{display:none}
#bigLine{max-width:38rem;font:italic 300 clamp(1.45rem,3.6vw,2.35rem)/1.3 var(--f-title);color:var(--chalk);text-wrap:balance;text-shadow:0 0 24px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.8)}
#big.dark #bigLine{color:#1d1a16;text-shadow:0 0 18px rgba(255,255,255,.9)} #big.dark #bigTime{color:#3a5a78;text-shadow:none}

/* nápoveda ovládania */
#hint{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(44px + env(safe-area-inset-top,0px));max-width:min(30rem,calc(100vw - 32px));
  font:400 11px/1.7 var(--f-mono);letter-spacing:.06em;color:var(--ink);pointer-events:none;transition:opacity 1.2s;text-shadow:0 0 8px #000}
#hint b{font-weight:500;color:var(--chalk)}

/* denník: otázky na doplnenie a nálezy */
#journal{position:fixed;inset:0;background:rgba(2,3,6,.95);overflow:auto;touch-action:pan-y;overscroll-behavior:contain;
  padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.jw{max-width:46rem;margin:0 auto}
.jtop{display:flex;align-items:baseline;gap:8px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.jh{margin:0;font:300 clamp(2.2rem,6vw,3rem)/1 var(--f-title);flex:1 1 auto}
.jtabs{display:flex;gap:18px}
.jtabs button,#jClose{appearance:none;background:none;border:0;border-bottom:1px solid transparent;padding:8px 0;cursor:pointer;font:500 11px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.jtabs button.on{color:var(--chalk);border-bottom-color:var(--keeper)}
.jtabs button:focus-visible,#jClose:focus-visible{outline:1px solid var(--keeper);outline-offset:3px}
#jBody.jf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:0 30px}
.q{padding:18px 6px 16px;margin:0 -6px;border-bottom:1px solid var(--line)}
.q h4{margin:0 0 8px;font:300 clamp(1.5rem,4vw,1.85rem)/1.1 var(--f-title);color:var(--chalk)}
.q.locked h4{color:var(--ink)}
.q.solved h4{color:var(--rift)}
.qs{margin:0;font:italic 400 1.08rem/2.15 var(--f-body);color:var(--chalk);text-wrap:pretty}
.blank{appearance:none;background:rgba(241,215,164,.07);border:0;border-bottom:1.5px dashed rgba(241,215,164,.7);border-radius:3px 3px 0 0;padding:3px 10px;margin:0 2px;cursor:pointer;
  font:500 .74rem/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--keeper);vertical-align:baseline}
.blank.set{font:italic 400 1.04rem/1.3 var(--f-body);letter-spacing:0;text-transform:none;border-bottom-style:solid;background:rgba(241,215,164,.1);color:var(--chalk)}
.blank:hover,.blank:focus-visible{background:rgba(241,215,164,.18);outline:none}
.word{color:var(--rift);border-bottom:1px solid rgba(169,220,255,.45)}
.qn{margin:0;font:italic 400 1rem/1.55 var(--f-body);color:var(--chalk);opacity:.82}
.qhint{margin:6px 0 0;min-height:1em;font:400 11px/1.5 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.q.ready .qhint{color:#e9a48d}
.qreal{margin:10px 0 0;font:600 clamp(1.3rem,3vw,1.55rem)/1.25 var(--f-hand);color:var(--rift);text-wrap:pretty}
.q.just{animation:glowIn 1.8s ease-out}
@keyframes glowIn{0%{background:rgba(169,220,255,.18)}100%{background:rgba(169,220,255,0)}}
.q.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#pop{position:fixed;display:flex;flex-direction:column;box-sizing:border-box;background:rgba(8,9,14,.97);border:1px solid var(--line);border-top:2px solid var(--keeper);
  box-shadow:0 20px 60px rgba(0,0,0,.75);padding:6px 0;max-height:60vh;overflow:auto;z-index:9}
#pop button{appearance:none;background:none;border:0;text-align:left;padding:11px 16px;cursor:pointer;font:italic 400 1.04rem/1.35 var(--f-body);color:var(--chalk)}
#pop button:hover,#pop button:focus-visible{background:rgba(241,215,164,.13);outline:none}
.jcol h3{margin:20px 0 6px;font:500 11px/1 var(--f-mono);letter-spacing:.22em;text-transform:uppercase}
.jt{color:var(--rift)} .jm{color:var(--ember)} .js{color:var(--keeper)}
.je{padding:10px 0;border-top:1px solid var(--line)}
.je h4{margin:0 0 4px;font:300 1.32rem/1.1 var(--f-title)}
.je p{margin:0;font:italic 400 .93rem/1.55 var(--f-body);color:var(--chalk);opacity:.9}
.jempty{margin:6px 0;color:var(--ink)}

/* titulná obrazovka, koniec, pauza */
#title,#endscreen,#pause{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#title{background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,.05),rgba(0,0,0,.72) 75%)}
.tw{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:40rem}
.t-eye{margin:0;font:400 12px/1 var(--f-mono);letter-spacing:.3em;text-transform:uppercase;color:var(--rift)}
#title h1{margin:0;font:300 clamp(4.2rem,17vw,10.5rem)/.9 var(--f-title);letter-spacing:.02em;color:var(--chalk);text-shadow:0 0 60px rgba(169,220,255,.18)}
.t-tag{margin:0;font:italic 400 clamp(1.05rem,2.6vw,1.35rem)/1.4 var(--f-body);color:var(--chalk)}
.t-go{margin-top:18px;font:500 12px/1 var(--f-mono);letter-spacing:.24em;text-transform:uppercase;color:var(--keeper);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.t-link{appearance:none;background:none;border:0;padding:6px 2px;cursor:pointer;font:500 12px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--rift);
  border-bottom:1px solid rgba(169,220,255,.35)}
.t-link:focus-visible,#title:focus-visible{outline:1px solid var(--keeper);outline-offset:4px}
.t-meta{margin:10px 0 0;font:400 11px/1.75 var(--f-mono);letter-spacing:.06em;color:var(--ink);max-width:34rem}
.t-meta b{font-weight:500;color:var(--chalk)}
.opts{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 22px;margin-top:4px;font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.opts .langs{display:flex;gap:10px}
.opts button{appearance:none;background:none;border:0;border-bottom:1px solid transparent;cursor:pointer;padding:7px 2px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink)}
.opts [data-lang].on{color:var(--chalk);border-bottom-color:var(--keeper)}
.opts button:hover{color:var(--chalk)}
.opts button:focus-visible{outline:1px solid var(--keeper);outline-offset:3px}
.qbtn b{font-weight:500;color:var(--chalk)}
#endscreen{background:rgba(0,0,0,.78)}
.e-kicker{margin:0;font:500 11px/1 var(--f-mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ink)}
#eTitle{margin:0;font:300 clamp(2.8rem,10vw,6rem)/.95 var(--f-title);letter-spacing:.04em;color:var(--chalk);text-wrap:balance}
#eLine{margin:0;max-width:34rem;font:italic 400 clamp(1.02rem,2.4vw,1.25rem)/1.5 var(--f-body);color:var(--chalk);text-wrap:balance}
#eList{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin:10px 0 0;padding:0;list-style:none;font:400 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
#eList li.got{color:var(--keeper)}
.e-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-top:8px}
#pause{background:rgba(0,0,0,.6)}
#pause h2{margin:0;font:300 clamp(2.4rem,8vw,4rem)/1 var(--f-title)}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:italic 400 1.1rem/1.6 var(--f-body);background:#000;color:var(--chalk)}
/* uložené hry: tri sloty, export a import */
#saves{position:fixed;inset:0;z-index:6;background:rgba(2,3,6,.985);overflow:auto;touch-action:pan-y;overscroll-behavior:contain;cursor:default;text-align:left;
  padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sw{max-width:40rem;margin:0 auto}
.stop{display:flex;align-items:baseline;gap:8px 22px;border-bottom:1px solid var(--line);padding-bottom:12px}
#sClose,#jSaves{appearance:none;background:none;border:0;border-bottom:1px solid transparent;padding:8px 0;cursor:pointer;font:500 11px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
#sClose:hover,#jSaves:hover{color:var(--chalk)}
#jSaves:focus-visible{outline:1px solid var(--keeper);outline-offset:3px}
.snote{margin:14px 0 0;font:italic 400 1rem/1.5 var(--f-body);color:var(--keeper)}
.slot{padding:16px 0 14px;border-bottom:1px solid var(--line)}
.sl-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px}
.sl-n{font:300 clamp(1.5rem,4vw,1.85rem)/1.1 var(--f-title);color:var(--chalk)}
.slot.empty .sl-n{color:var(--ink)}
.sl-cur{font:500 10px/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--keeper)}
.sl-t{margin-left:auto;font:400 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink);font-variant-numeric:tabular-nums}
.sl-d{margin:6px 0 10px;font:italic 400 1rem/1.5 var(--f-body);color:var(--chalk);opacity:.88}
.slot.empty .sl-d{color:var(--ink);opacity:1}
.sl-a,.sio{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.sl-a button,.sio button{appearance:none;background:none;border:0;border-bottom:1px solid rgba(169,220,255,.35);padding:7px 1px;cursor:pointer;
  font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--rift)}
.sl-a button:hover,.sio button:hover{color:var(--chalk)}
.sl-a button.danger{color:#e9a48d;border-bottom-color:rgba(233,164,141,.45)}
.sl-q{font:italic 400 1rem/1.3 var(--f-body);color:var(--chalk)}
#saves button:focus-visible,#sText:focus-visible{outline:1px solid var(--keeper);outline-offset:3px}
#sPanel{margin-top:18px;padding:16px clamp(14px,3vw,20px);border:1px solid var(--line);border-top:2px solid var(--keeper);background:rgba(8,9,14,.85)}
#sPH{margin:0;font:500 11px/1.4 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--keeper)}
#sPanel .snote{margin:8px 0 10px;color:var(--chalk);opacity:.85}
#sText{display:block;width:100%;box-sizing:border-box;min-height:7em;margin:0 0 12px;resize:vertical;background:rgba(0,0,0,.55);color:var(--chalk);border:1px solid var(--line);border-radius:2px;
  padding:10px;font:400 12px/1.5 var(--f-mono);word-break:break-all;-webkit-user-select:text;user-select:text;touch-action:auto}
#sMsg{min-height:1.4em;margin:14px 0 0;font:400 11px/1.5 var(--f-mono);letter-spacing:.06em;color:var(--ink)}
#sMsg.ok{color:var(--rift)} #sMsg.err{color:#e9a48d}
.t-acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px}
@media (pointer:coarse){#sText{font-size:16px}}
/* vrstvy: scéna < stmievanie < HUD < titulky a filmový text < karty a denník < obrazovky */
#c{z-index:0} #vig,#scope{z-index:1} #fade{z-index:2} #hud,#cross,#prompt,#compass{z-index:3} #subs,#big,#hint{z-index:4} #card,#journal{z-index:5} #title,#endscreen,#pause{z-index:6} #nogl{z-index:7}

<script>
/* ak sa hra nespustí, nech je na titulke vidno prečo (namiesto prázdnej čiernej obrazovky) */
(function () {
  var shown = false;
  function sk() { try { return /^sk|-sk$/i.test((navigator.languages && navigator.languages[0]) || navigator.language || ''); } catch (e) { return false; } }
  function show(msg) {
    if (shown || window.__ludvikBooted) return; shown = true;
    var go = document.getElementById('tGo'), meta = document.getElementById('tMeta');
    if (go) { go.textContent = sk() ? 'Hru sa nepodarilo spustiť' : 'The game failed to start'; go.style.animation = 'none'; }
    if (meta) meta.textContent = String(msg || '').slice(0, 400);
  }
  window.__ludvikFail = show;
  window.addEventListener('error', function (e) { show((e && (e.message || (e.error && e.error.message))) || 'error'); });
  window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; show((r && (r.message || String(r))) || 'error'); });
  setTimeout(function () { if (!window.__ludvikBooted) show(sk() ? 'Skript hry sa nenačítal včas.' : 'The game script did not load in time.'); }, 25000);
})();
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

/* ================= utility ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const linear = t => t;
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let rnd = mulberry32(19931);
const rr = (a, b) => a + (b - a) * rnd();
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const $ = id => document.getElementById(id);

const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || (('ontouchstart' in window) && navigator.maxTouchPoints > 0);
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ================= renderer ================= */
const canvas = $('c');
let renderer;
try {
  /* vyhladzovanie robí vlastný render target (MSAA) alebo FXAA v kompozícii */
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  const sk = /^sk|-sk$/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '');
  $('nogl').textContent = sk ? 'Tvoj prehliadač nevie spustiť WebGL, takže Ludvík nemá kde lietať. Skús iný prehliadač alebo zapni hardvérovú akceleráciu.' : "Your browser can't run WebGL, so Ludvík has nowhere to fly. Try another browser or turn on hardware acceleration.";
  $('nogl').hidden = false;
  throw e;
}
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
/* pevný strop hustoty pixelov; nikdy sa neznižuje podľa výkonu */
const PR_MAX = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2);
renderer.setPixelRatio(PR_MAX);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.021);
const FOG_BASE = 0.021;
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 500);
camera.rotation.order = 'YXZ';
let activeScene = scene;

/* ================= kvalita ================= */
const QKEY = 'ludvik-quality';
let QUALITY = IS_TOUCH ? 'low' : 'high';
try { const q = localStorage.getItem(QKEY); if (q === 'low' || q === 'high') QUALITY = q; } catch (e) { /* bez úložiska */ }

/* ================= post-processing: bloom, lúče z červej diery, tuš, farebné ladenie, zrno =================
   Postup inšpirovaný Wildbrushom, ale lacnejší: žiadne SSAO, žiadne tiene, plné rozlíšenie bez znižovania. */
const FS = (() => {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));
  const mesh = new THREE.Mesh(geo); mesh.frustumCulled = false;
  const sc = new THREE.Scene(); sc.add(mesh);
  return { mesh, scene: sc, cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1) };
})();
const FS_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
function fsMat(frag, uniforms) { return new THREE.ShaderMaterial({ vertexShader: FS_VERT, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false, toneMapped: false }); }
function fsPass(mat, target) { FS.mesh.material = mat; renderer.setRenderTarget(target); renderer.render(FS.scene, FS.cam); }

/* jeden pokazený pixel (NaN/Inf) by sa cez bloom rozmazal na veľký čierny osemuholník; tu sa zahodí */
const POST_CLEAN = `
#if __VERSION__ >= 300
  bool badf(float x){ return (floatBitsToUint(x) & 0x7f800000u) == 0x7f800000u; }
#else
  bool badf(float x){ return !(x >= -65000.0 && x <= 65000.0); }
#endif
  vec3 clean(vec3 c){ return (badf(c.r) || badf(c.g) || badf(c.b)) ? vec3(0.0) : max(c, vec3(0.0)); }
`;
const POST_PREFILTER = POST_CLEAN + `uniform sampler2D tSrc; uniform vec2 uTexel; uniform float uThr; uniform float uKnee; varying vec2 vUv;
  void main(){
    vec3 a = clean(texture2D(tSrc, vUv + uTexel * vec2(-1.0, -1.0)).rgb), b = clean(texture2D(tSrc, vUv + uTexel * vec2(1.0, -1.0)).rgb);
    vec3 c = clean(texture2D(tSrc, vUv + uTexel * vec2(-1.0, 1.0)).rgb), d = clean(texture2D(tSrc, vUv + uTexel * vec2(1.0, 1.0)).rgb);
    float wa = 1.0 / (1.0 + max(a.r, max(a.g, a.b))), wb = 1.0 / (1.0 + max(b.r, max(b.g, b.b)));
    float wc = 1.0 / (1.0 + max(c.r, max(c.g, c.b))), wd = 1.0 / (1.0 + max(d.r, max(d.g, d.b)));
    vec3 col = (a * wa + b * wb + c * wc + d * wd) / (wa + wb + wc + wd);
    float br = max(col.r, max(col.g, col.b));
    float soft = clamp(br - uThr + uKnee, 0.0, 2.0 * uKnee); soft = soft * soft / (4.0 * uKnee + 1e-4);
    gl_FragColor = vec4(col * max(soft, br - uThr) / max(br, 1e-4), 1.0);
  }`;
const POST_DOWN = `uniform sampler2D tSrc; uniform vec2 uTexel; varying vec2 vUv;
  void main(){
    vec3 s = texture2D(tSrc, vUv).rgb * 4.0;
    s += texture2D(tSrc, vUv + uTexel * vec2(-1.0, -1.0)).rgb + texture2D(tSrc, vUv + uTexel * vec2(1.0, -1.0)).rgb;
    s += texture2D(tSrc, vUv + uTexel * vec2(-1.0, 1.0)).rgb + texture2D(tSrc, vUv + uTexel * vec2(1.0, 1.0)).rgb;
    gl_FragColor = vec4(s * 0.125, 1.0);
  }`;
const POST_UP = `uniform sampler2D tLow; uniform sampler2D tHigh; uniform vec2 uTexel; varying vec2 vUv;
  void main(){
    vec2 o = uTexel;
    vec3 s = texture2D(tLow, vUv + vec2(-2.0 * o.x, 0.0)).rgb + texture2D(tLow, vUv + vec2(2.0 * o.x, 0.0)).rgb;
    s += texture2D(tLow, vUv + vec2(0.0, -2.0 * o.y)).rgb + texture2D(tLow, vUv + vec2(0.0, 2.0 * o.y)).rgb;
    s += (texture2D(tLow, vUv + vec2(-o.x, -o.y)).rgb + texture2D(tLow, vUv + vec2(o.x, -o.y)).rgb + texture2D(tLow, vUv + vec2(-o.x, o.y)).rgb + texture2D(tLow, vUv + vec2(o.x, o.y)).rgb) * 2.0;
    gl_FragColor = vec4(texture2D(tHigh, vUv).rgb + s / 12.0, 1.0);
  }`;
/* lúče: pochod od pixelu k červej diere, iba hĺbka a jasná časť obrazu, bez ďalších renderov scény */
const POST_SHAFT = `uniform sampler2D tSrc; uniform sampler2D tDepth; uniform vec2 uSun; uniform float uSunZ; uniform float uR; uniform float uAspect; uniform float uNear; uniform float uFar; varying vec2 vUv;
  float vz(float d){ return uNear * uFar / (uFar - d * (uFar - uNear)); }
  void main(){
    vec2 st = (uSun - vUv) / 26.0;
    float jit = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
    vec2 p = vUv + st * jit; vec3 sum = vec3(0.0); float w = 1.0;
    for (int i = 0; i < 26; i++) {
      vec2 q = clamp(p, 0.001, 0.999);
      float inb = step(abs(p.x - 0.5), 0.5) * step(abs(p.y - 0.5), 0.5);
      float vis = step(uSunZ - uR, vz(texture2D(tDepth, q).r)) * inb;
      float r = length((p - uSun) * vec2(uAspect, 1.0));
      sum += texture2D(tSrc, q).rgb * vis * exp(-r * 6.5) * w;
      w *= 0.94; p += st;
    }
    float d = length((vUv - uSun) * vec2(uAspect, 1.0));
    gl_FragColor = vec4(sum / 26.0 * exp(-d * 1.6), 1.0);
  }`;
const POST_COMPOSITE = POST_CLEAN + `uniform sampler2D tScene; uniform sampler2D tBloom; uniform sampler2D tShaft; uniform sampler2D tDepth;
  uniform vec2 uRes; uniform float uExposure; uniform float uBloom; uniform float uShaft; uniform vec3 uShaftCol; uniform float uInk; uniform float uFxaa;
  uniform float uNear; uniform float uFar; uniform float uTime; uniform float uGrain; uniform float uPaper; uniform float uVig; uniform float uLift; uniform float uSat; uniform float uContrast;
  varying vec2 vUv;
  float lumC(vec3 c){ return dot(c / (1.0 + c), vec3(0.299, 0.587, 0.114)); }
  vec3 tsc(vec2 uv){ return clean(texture2D(tScene, uv).rgb); }
  vec3 sceneAA(vec2 uv){
    vec3 cM = tsc(uv);
    if (uFxaa < 0.5) return cM;
    vec2 px = 1.0 / uRes;
    vec3 cNW = tsc(uv + vec2(-1.0, -1.0) * px), cNE = tsc(uv + vec2(1.0, -1.0) * px);
    vec3 cSW = tsc(uv + vec2(-1.0, 1.0) * px), cSE = tsc(uv + vec2(1.0, 1.0) * px);
    float lNW = lumC(cNW), lNE = lumC(cNE), lSW = lumC(cSW), lSE = lumC(cSE), lM = lumC(cM);
    float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE))), lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
    vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), (lNW + lSW) - (lNE + lSE));
    float red = max((lNW + lNE + lSW + lSE) * 0.03125, 1.0 / 128.0);
    float rcp = 1.0 / (min(abs(dir.x), abs(dir.y)) + red);
    dir = clamp(dir * rcp, vec2(-8.0), vec2(8.0)) * px;
    vec3 a = 0.5 * (tsc(uv + dir * (1.0 / 3.0 - 0.5)) + tsc(uv + dir * (2.0 / 3.0 - 0.5)));
    vec3 b = a * 0.5 + 0.25 * (tsc(uv - dir * 0.5) + tsc(uv + dir * 0.5));
    float lB = lumC(b);
    return (lB < lMin || lB > lMax) ? a : b;
  }
  float vz(float d){ return uNear * uFar / (uFar - d * (uFar - uNear)); }
  vec3 aces(vec3 v){
    const mat3 inM = mat3(vec3(0.59719, 0.07600, 0.02840), vec3(0.35458, 0.90834, 0.13383), vec3(0.04823, 0.01566, 0.83777));
    const mat3 outM = mat3(vec3(1.60475, -0.10208, -0.00327), vec3(-0.53108, 1.10813, -0.07276), vec3(-0.07367, -0.00605, 1.07602));
    v = inM * (v / 0.6);
    vec3 a = v * (v + 0.0245786) - 0.000090537, b = v * (0.983729 * v + 0.4329510) + 0.238081;
    return clamp(outM * (a / b), 0.0, 1.0);
  }
  vec3 srgb(vec3 c){ return mix(c * 12.92, 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
  float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  float n21(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), u.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), u.x), u.y); }
  void main(){
    vec3 c = sceneAA(vUv);
    if (uInk > 0.001) {
      float d0 = texture2D(tDepth, vUv).r;
      if (d0 < 0.99995) {
        float zc = vz(d0); vec2 o = 1.0 / uRes;
        float zm = max(max(vz(texture2D(tDepth, vUv + vec2(o.x, 0.0)).r), vz(texture2D(tDepth, vUv - vec2(o.x, 0.0)).r)),
                       max(vz(texture2D(tDepth, vUv + vec2(0.0, o.y)).r), vz(texture2D(tDepth, vUv - vec2(0.0, o.y)).r)));
        float edge = smoothstep(0.06, 0.45, (zm - zc) / max(zc, 0.1)) * (1.0 - smoothstep(16.0, 55.0, zc));
        c = mix(c, c * vec3(0.30, 0.26, 0.36), edge * uInk);
      }
    }
    c += texture2D(tBloom, vUv).rgb * uBloom;
    c += texture2D(tShaft, vUv).rgb * uShaftCol * uShaft;
    c = aces(c * uExposure);
    vec3 p = srgb(c);
    float l = dot(p, vec3(0.2126, 0.7152, 0.0722));
    p *= mix(vec3(0.95, 0.98, 1.07), vec3(1.05, 1.0, 0.93), smoothstep(0.08, 0.75, l));
    p += uLift * vec3(0.55, 0.65, 1.0) * (1.0 - smoothstep(0.0, 0.3, l));
    p = mix(p, p * p * (3.0 - 2.0 * p), uContrast);
    float l2 = dot(p, vec3(0.2126, 0.7152, 0.0722));
    p = mix(vec3(l2), p, uSat);
    vec2 q = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
    p = mix(p, p * vec3(0.66, 0.64, 0.76), smoothstep(0.38, 1.25, length(q)) * uVig);
    vec2 px = vUv * uRes;
    vec2 pp = px / max(uRes.y, 1.0) * 720.0;
    float paper = n21(pp * 0.9) * 0.5 + n21(pp * 2.3 + 17.0) * 0.3 + n21(vec2(pp.x * 0.35, pp.y * 3.1)) * 0.2 - 0.5;
    p *= 1.0 + paper * uPaper * (4.0 * l2 * (1.0 - l2) + 0.25);
    float g = h21(px + fract(uTime * 0.6180339) * 311.0) + h21(px * 1.37 - fract(uTime * 0.381966) * 173.0) - 1.0;
    p += g * uGrain * (0.004 + sqrt(max(l2, 0.0)) * 0.012);
    gl_FragColor = vec4(clean(p), 1.0);
  }`;

const Post = {
  ok: false, levels: 5, w: 0, h: 0, rt: null, depth: null, down: [], up: [], shaft: null, samples: 0,
  exposure: 1.05, bloom: 0.11, shaftI: 0, ink: 0.6, grainT: 0,
  sun: new THREE.Vector2(0.5, 0.5), sunZ: 1, sunR: 0.5,
  init() {
    const caps = renderer.capabilities, ext = renderer.extensions;
    this.ok = caps.isWebGL2 ? ext.has('EXT_color_buffer_float') || ext.has('EXT_color_buffer_half_float') : ext.has('OES_texture_half_float') && ext.has('EXT_color_buffer_half_float');
    if (!this.ok) return;
    const T = () => ({ value: null }), V2 = () => ({ value: new THREE.Vector2() });
    this.mPre = fsMat(POST_PREFILTER, { tSrc: T(), uTexel: V2(), uThr: { value: 1.15 }, uKnee: { value: 0.45 } });
    this.mDown = fsMat(POST_DOWN, { tSrc: T(), uTexel: V2() });
    this.mUp = fsMat(POST_UP, { tLow: T(), tHigh: T(), uTexel: V2() });
    this.mShaft = fsMat(POST_SHAFT, { tSrc: T(), tDepth: T(), uSun: V2(), uSunZ: { value: 1 }, uR: { value: 0.5 }, uAspect: { value: 1 }, uNear: { value: 0.05 }, uFar: { value: 500 } });
    this.mComp = fsMat(POST_COMPOSITE, {
      tScene: T(), tBloom: T(), tShaft: T(), tDepth: T(), uRes: V2(), uExposure: { value: 1.05 }, uBloom: { value: 0.16 }, uShaft: { value: 0 }, uShaftCol: { value: new THREE.Color(0xcfe9ff) },
      uInk: { value: 0.6 }, uFxaa: { value: 0 }, uNear: { value: 0.05 }, uFar: { value: 500 }, uTime: { value: 0 }, uGrain: { value: 1 }, uPaper: { value: 0.07 },
      uVig: { value: 0.55 }, uLift: { value: 0.012 }, uSat: { value: 1.07 }, uContrast: { value: 0.14 },
    });
    this.black = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1); this.black.needsUpdate = true;

const STORE = { active: 0, slots: new Array(SLOTS).fill(null) };
const AREA_IDS = ['trieda', 'kotolna', 'kniznica', 'dvor', 'strecha', 'chodba', 'satna', 'fyzika', 'telocvicna', 'riaditelna'];

/* ---------- očistenie stavu: z importu ani zo starého úložiska nesmie prísť nič neznáme ---------- */
function cleanSave(s) {

    if (Array.isArray(a)) qfill[q] = a.slice(0, 4).map(x => (Number.isInteger(x) && x >= 0 && x < 12 ? x : null));
  }
  const out = {
    v: 2, clues: pick(s.clues, CLUE_IDS), memories: pick(s.memories, MEM_IDS), secret: yes(s.secret), secretTalked: yes(s.secretTalked),
    facts: pick(s.facts, FACT_IDS), flags: { lights: yes(f.lights), key: yes(f.key), door: yes(f.door), cal: yes(f.cal) },
    solved: pick(s.solved, Q_ORDER), seenQ: pick(s.seenQ, Q_ORDER), ready: pick(s.ready, Q_ORDER), qfill,
    areas: pick(s.areas, AREA_IDS), revealed: yes(s.revealed), k: [0, 1, 2].map(i => Array.isArray(s.k) && yes(s.k[i])),
    edgeEvent: yes(s.edgeEvent), board: clamp(Math.round(num(s.board, 0)), 0, 4), lookedDown: yes(s.lookedDown),
  };
  if (!out.areas.includes('trieda')) out.areas.unshift('trieda');
  if (Array.isArray(s.pos) && s.pos.length === 3 && s.pos.every(x => typeof x === 'number' && isFinite(x))) {
    out.pos = s.pos.slice(); out.yaw = num(s.yaw, 0); out.pitch = clamp(num(s.pitch, 0), -1.52, 1.52);

}
function cleanSlot(o) {
  if (!o || typeof o !== 'object') return null;
  const save = cleanSave(o.save), checkpoint = cleanSave(o.checkpoint);
  if (!save && !checkpoint) return null;
  return { save, checkpoint, t: typeof o.t === 'number' && isFinite(o.t) ? o.t : Date.now() };
}

/* ---------- úložisko: tri sloty; aktívny slot je ten, do ktorého sa práve priebežne ukladá ---------- */
function loadStore() {
  const endings = new Set(); let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { s = null; }
  if (s && Array.isArray(s.slots)) {
    for (let i = 0; i < SLOTS; i++) STORE.slots[i] = cleanSlot(s.slots[i]);
    STORE.active = clamp(s.active | 0, 0, SLOTS - 1);
    if (Array.isArray(s.endings)) s.endings.forEach(e => endings.add(e));
  } else {
    /* prvé spustenie tejto verzie: doterajšia hra sa presunie do slotu 1 */
    let o = null;
    try { o = JSON.parse(localStorage.getItem(OLD_SAVE_KEY) || 'null'); } catch (e) { o = null; }
    if (o && typeof o === 'object') {
      STORE.slots[0] = cleanSlot({ save: o.save, checkpoint: o.checkpoint, t: Date.now() });
      if (Array.isArray(o.endings)) o.endings.forEach(e => endings.add(e));
    }
  }
  try { const old = JSON.parse(localStorage.getItem('ludvik-temna-era-v1') || 'null'); if (old && Array.isArray(old.endings)) old.endings.forEach(e => endings.add(e)); } catch (e) { /* bez starého uloženia */ }
  return { endings: [...endings].filter(e => ENDING_IDS.includes(e)) };
}
function persistStore() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 3, active: STORE.active, endings: [...G.endingsSeen], slots: STORE.slots })); } catch (e) { /* bez úložiska */ }
}
const copyState = o => (o ? JSON.parse(JSON.stringify(o)) : null);
function writeStore() {
  STORE.slots[G.slot] = G.save || G.checkpoint ? { save: copyState(G.save), checkpoint: copyState(G.checkpoint), t: Date.now() } : null;
  STORE.active = G.slot; persistStore();
}
function useSlot(k) { G.slot = k; STORE.active = k; const sl = STORE.slots[k]; G.save = sl ? copyState(sl.save) : null; G.checkpoint = sl ? copyState(sl.checkpoint) : null; }

function bestSlot() {
  if (slotData(STORE.active)) return STORE.active;
  let b = -1, bt = -Infinity;
  STORE.slots.forEach((sl, i) => { if (sl && sl.t > bt) { bt = sl.t; b = i; } });
  return b >= 0 ? b : STORE.active;

/* nová hra ide do prázdneho slotu; keď sú všetky plné, hráč vyberie, ktorý prepísať */
function freeSlot() {
  if (!slotData(G.slot)) return G.slot;
  for (let i = 0; i < SLOTS; i++) if (!slotData(i)) return i;
  return -1;
}
const inGame = () => G.phase !== 'title' && G.phase !== 'end';

/* ---------- kód uloženej hry: JSON, zbalený deflate, v base64url ---------- */
function b64u(bytes) {

  for (let i = anims.length - 1; i >= 0; i--) { const a = anims[i]; const u = clamp((gameTime - a.t0) / a.dur, 0, 1); a.fn(a.ease(u)); if (u >= 1) { anims.splice(i, 1); a.res(); } }

    CAM.pos.set(WC.x + Math.cos(titleAngle) * 46, WC.y + 9 + Math.sin(titleAngle * 0.7) * 5, WC.z + Math.sin(titleAngle) * 46); CAM.look.copy(WC);

  if (COS) COS.update(dt, t); if (SUN) SUN.update(dt, t);
  if (activeScene === scene && G.ending !== 'vesmir') {
    scene.fog.density = G.fogOverride != null ? G.fogOverride : G.phase === 'title' ? 0.012 : FOG_BASE + G.edgeAmt * 0.055;

}

let BOOTED = false;

}
async function bootInner(data) {

  sv.endings.forEach(e => G.endingsSeen.add(e));
  if (!STORE.slots.some(Boolean) && data && (data.save || data.checkpoint)) STORE.slots[0] = cleanSlot({ save: data.save, checkpoint: data.checkpoint });
  useSlot(bestSlot());
  getDownloads();
  setLang(initialLang(), false);
  titleMeta();
  requestAnimationFrame(frame);
  await fontsReady();
  buildKeeper(); buildWorld();
  CAM.mode = 'script';
  G.phase = 'title'; READY = true;
  applyLangDOM(); titleMeta();
}
try { window.claude?.hot?.snapshot?.(() => ({ save: G.save, checkpoint: G.checkpoint, endings: [...G.endingsSeen] })); } catch (e) { /* mimo prehliadača artifactov */ }
{
  let hot = null;
  try { hot = window.claude && window.claude.hot; } catch (e) { hot = null; }
  if (hot && typeof hot.ready === 'function') {
    try { hot.ready(d => boot(d || {})); } catch (e) { boot({}); }
    setTimeout(() => { if (!BOOTED) boot((hot && hot.data) || {}); }, 2500);
  } else boot((hot && hot.data) || {});
}

  info() { let n = 0, tri = 0; scene.traverse(o => { if (o.isMesh || o.isPoints || o.isSprite || o.isLine) { n++; if (o.geometry && o.geometry.attributes.position) tri += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } }); return { objects: n, tris: Math.round(tri), mem: renderer.info.memory, progs: renderer.info.programs.length, lights: lamps.length }; },
  cal() { return { flag: !!G.flags.cal, pending: !!G.pendingCal, revealed: CAL.revealed, tag: !!(CAL.tag && CAL.tag.visible), note: !!(CAL.note && CAL.note.visible), dist: +P.pos.distanceTo(CAL.pos).toFixed(2), target: target ? target.id : null, sub: !!subState }; },
