name: Deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-9959b70d-4wee52]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      # Needs Settings → Pages → Build and deployment → Source: "GitHub Actions" (one-time switch).
      - uses: actions/configure-pages@v6

      # Publish only the game itself: the page, the models and the vendored three.js.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html models vendor _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
